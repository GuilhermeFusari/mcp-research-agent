# Alternativa ao modo "executavel": use com modo = "docker" no config.toml.
services:
  qdrant:
    image: qdrant/qdrant:v1.19.1
    container_name: agente-qdrant
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - ./qdrant_data:/qdrant/storage
    restart: unless-stopped
