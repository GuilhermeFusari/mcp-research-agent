name: testes

on:
  # Só um disparo por mudança: push na main ou PR (antes rodava duas vezes por PR).
  push:
    branches: [main]
  pull_request:

jobs:
  testes:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.13"]
        # macOS só numa versão: os runners de Mac do GitHub vivem com fila cheia.
        include:
          - os: macos-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Só o núcleo leve + ferramentas de teste: as APIs são simuladas (respx), sem rede.
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
