# Modelo de configuração. O instalar.ps1 copia para config.toml (pessoal, fora do Git).

[indexacao]
# Só estas pastas (e subpastas) são indexadas. "~" = pasta do usuário;
# o instalador troca pelos caminhos reais (inclusive OneDrive).
pastas = [
    '~\Desktop',
    '~\Downloads',
    '~\Documents',
]

# PDFs cujo caminho contém um destes termos são ignorados (sem diferenciar maiúsculas).
excluir_se_contem = [
    "boleto", "fatura", "nota fiscal", "nf-e", "extrato", "comprovante",
    "contrato", "holerite", "contracheque", "imposto", "irpf", "cpf", " rg",
    "passaporte", "pessoal", "financeiro", "banco",
]

[chunking]
# Em caracteres. Mudou? Rode: python indexar.py --reindexar
tamanho = 1000
sobreposicao = 200

[embeddings]
modelo = "intfloat/multilingual-e5-base"

[qdrant]
# "executavel": o programa inicia o bin/qdrant.exe sozinho (sem Docker).
# "docker":     o Qdrant roda via "docker compose up -d".
modo = "executavel"
# Use 127.0.0.1, não "localhost" (no Windows, localhost adiciona ~2 s por conexão).
url = "http://127.0.0.1:6333"
colecao = "pdfs"

[seguranca]
# Mudanças aqui valem após reiniciar o Claude Desktop (não precisa reindexar).

# Níveis: "publico" < "interno" < "confidencial". Só é enviado ao Claude o que
# for <= nivel_maximo_enviado.
nivel_padrao = "interno"
nivel_maximo_enviado = "interno"
confidencial_se_contem = ["confidencial", "sigiloso", "nda", "privado"]
publico_se_contem = []

# Troca CPF, CNPJ, e-mail, telefone e cartão por [CPF], [EMAIL] etc.
mascarar_dados_pessoais = true

# Registra cada chamada em logs/auditoria.jsonl.
auditoria = true
# false = salva só hash e tamanho do que foi enviado, não o texto.
auditoria_salvar_texto = false

[ocr]
# Aplicado só em páginas sem texto (escaneadas).
ativo = true
idiomas = ["pt", "en"]
dpi = 200
