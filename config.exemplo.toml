# Configuração do agente de pesquisa.
# TOML é um formato de config legível; o Python lê nativamente (tomllib).
#
# ESTE É O MODELO. O instalar.ps1 copia para config.toml (o arquivo que o
# programa usa de verdade), que é pessoal e não vai para o Git.
# POR QUE UM ARQUIVO DE CONFIG? Cada pessoa (você, seus amigos) ajusta pastas
# e opções aqui, sem mexer no código.

[indexacao]
# ALLOWLIST: só estas pastas (e subpastas) são indexadas. Nada fora daqui.
# "~" = sua pasta de usuário. O instalar.ps1 troca pelos caminhos reais
# (inclusive quando a Área de Trabalho está dentro do OneDrive).
pastas = [
    '~\Desktop',
    '~\Downloads',
    '~\Documents',
]

# Qualquer PDF cujo caminho contenha um destes termos é IGNORADO
# (sem diferenciar maiúsculas/minúsculas). Protege documentos pessoais
# que costumam ficar misturados em Downloads.
excluir_se_contem = [
    "boleto", "fatura", "nota fiscal", "nf-e", "extrato", "comprovante",
    "contrato", "holerite", "contracheque", "imposto", "irpf", "cpf", " rg",
    "passaporte", "pessoal", "financeiro", "banco",
]

[chunking]
# Tamanho de cada pedaço (em caracteres) e quanto um pedaço repete do anterior.
# A sobreposição evita que uma ideia seja cortada ao meio entre dois chunks.
tamanho = 1000
sobreposicao = 200

[embeddings]
# Modelo multilíngue (PT + EN no mesmo espaço vetorial), roda local.
modelo = "intfloat/multilingual-e5-base"

[qdrant]
# "executavel": o programa liga o bin/qdrant.exe sozinho, em segundo plano
#               (baixado pelo instalador). Não precisa de Docker.
# "docker":     você sobe o Qdrant com "docker compose up -d".
modo = "executavel"
# 127.0.0.1 e não "localhost": no Windows, "localhost" tenta IPv6 primeiro
# e cada conexão perde ~2 s até cair no IPv4, onde o Qdrant escuta.
url = "http://127.0.0.1:6333"
colecao = "pdfs"

[seguranca]
# Mudou algo aqui? Reinicie o servidor (não precisa reindexar).

# CLASSIFICAÇÃO. Níveis: "publico" < "interno" < "confidencial".
# Cada PDF recebe um nível pelo caminho; só vai para o Claude o que for
# <= nivel_maximo_enviado.
nivel_padrao = "interno"
nivel_maximo_enviado = "interno"
# Caminho contém algum destes -> confidencial (nunca enviado).
confidencial_se_contem = ["confidencial", "sigiloso", "nda", "privado"]
# Caminho contém algum destes -> público.
publico_se_contem = []

# MASCARAMENTO: troca CPF, CNPJ, e-mail, telefone e cartão por [CPF], [EMAIL]...
mascarar_dados_pessoais = true

# AUDITORIA: registra cada chamada em logs/auditoria.jsonl.
auditoria = true
# false = guarda só hash e tamanho do que saiu (o log não vira cópia dos dados).
auditoria_salvar_texto = false

[ocr]
# Lê páginas escaneadas (imagem, sem texto) com EasyOCR. Só roda nessas
# páginas; PDFs normais não ficam mais lentos.
ativo = true
idiomas = ["pt", "en"]
# Resolução da "foto" da página: mais alto = mais preciso e mais lento.
dpi = 200
